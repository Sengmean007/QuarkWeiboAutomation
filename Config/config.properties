# QuarkWeiboAutomation - every setting a run can be pointed at.
#
# Read by org.sengmean.config.ConfigDataProvider at the start of a run. Override order:
#
#   1. -Dkey=value on the command line        ./mvnw test -Dheadless=false
#   2. the environment variable                BASE_URL=... ./mvnw test
#      (the same name, upper case, dots as underscores: base.url -> BASE_URL)
#   3. Config/secrets.properties              not committed - see secrets.properties.example
#   4. this file

# --- The environment under test ---

# Quark Dynasty, the HK-brand member site. An origin with no path and no query string - see
# BasePage.open() for why the path must not be pasted into this value.
base.url=https://test-v2.138hk.vip

# --- The account the signed-in suites sign in as ---
#
# qa00002, given by Si on 2026-10-16 for manual browser checks of this site. Wallets confirmed
# that day: USDT 140.00, TRX 15.22, THB 0.00, HKD 365.37, USD 0.00.
test.username=qa00002
test.password=password

# A second account, given by Si on 2026-10-24, for cases that need an account in a different
# state from the one above - starting with deposit/withdraw bank/account-binding validation,
# which needs an account with no payment method bound yet. Same captcha as every other form.
test.altUsername=qa000051
test.altPassword=password

# The captcha this test environment accepts for every form, whatever the image shows.
test.captcha=1111

# --- The language the UI picker starts on ---
#
# A fresh visitor is asked "No UI version - Old UI / New UI"; the suites answer New UI, which is
# the only one that draws Other Category sections. See admin-weibo-hk-client-new-ui for the
# sibling Admin_weibo project's notes on the same picker.

# --- Browser window ---

# true runs Chromium without a visible window, false shows it.
headless=false

# Milliseconds to pause between Playwright actions; 0 for a real run, 500-1000 for debugging.
slowMo=0

# --- Timeouts ---

# How long any single action - a click, a fill, waiting for an element - may take.
#
# Raised from 10000 on 2026-10-22: the 10.50 and 11.02 ResponsiveLayout runs against the real
# test-v2.138hk.vip site timed out clicking "Log In" on the PC, Mac and iPad rows - an overlay
# (the UI-version picker or a welcome banner re-raised by the fresh /en/log-in/ navigation) was
# still winning the hit test past the old 10s budget. 20s matches how long that site actually
# takes to settle.
test.actionTimeout=20000

# How long a navigation may take.
test.navigationTimeout=30000

# After a fresh sign-in, before the first case runs.
test.login.settle=3000
