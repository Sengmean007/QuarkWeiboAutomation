# How every suite in this project orders its cases.
#
# Without these, JUnit picks a deterministic but arbitrary order, and that is not the same thing as
# a sensible one. It bit the sibling Admin_weibo project for real: in a transfer-walk test class the
# sweep case ran before the case that funds the game wallets, so the sweep found everything empty and
# skipped, and the next case had nothing to transfer back. Both looked like environment problems for
# a while - see that project's own junit-platform.properties for the fuller story.
#
# testmethod.order.default = DisplayName
#   Every display name in this project begins with the case id - UI-001, LGN-002, WDX-005 - so
#   ordering by display name makes a suite run, and its report page read, in id order. That is
#   lexicographic rather than numeric, so a padded id sorts before a shorter one.
#
# testclass.order.default = OrderAnnotation
#   Nested groups carry @Order in their source order, which is the order their author meant them to
#   be read in. A group without @Order sorts last rather than randomly.
#
# A class that needs something else can say so locally and win, with its own
# @TestMethodOrder - none currently does.
junit.jupiter.testmethod.order.default = org.junit.jupiter.api.MethodOrderer$DisplayName
junit.jupiter.testclass.order.default = org.junit.jupiter.api.ClassOrderer$OrderAnnotation
